<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lumen — Prototype</title>
<style>
  html,body{margin:0;height:100%;background:#02060d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #game{display:block;background:#050b16}
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  #touch.on{display:block}
  .tb{position:absolute;pointer-events:auto;width:62px;height:62px;border-radius:50%;box-sizing:border-box;
      background:rgba(242,196,109,.10);border:2px solid rgba(242,196,109,.45);color:#f2c46d;
      font:600 15px Georgia,serif;display:flex;align-items:center;justify-content:center;touch-action:none}
  .tb.down{background:rgba(242,196,109,.35)}
  .tb.big{width:78px;height:78px;font-size:17px}
  #tune{position:fixed;top:8px;right:8px;width:290px;max-height:calc(100% - 16px);overflow:auto;box-sizing:border-box;
        background:rgba(6,14,26,.94);border:1px solid #2c4a5c;border-radius:8px;color:#d9e6ea;font:12px/1.3 system-ui,sans-serif;padding:10px;z-index:5}
  #tune[hidden]{display:none}
  #tune h3{margin:0 0 6px;font:600 14px Georgia,serif;color:#f2c46d;display:flex;justify-content:space-between}
  #tune h3 small{font:11px system-ui;color:#7d93a0}
  #tune .g{margin:10px 0 4px;color:#6fd6d0;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
  #tune label{display:block;margin:4px 0}
  #tune .row{display:flex;justify-content:space-between}
  #tune .v{color:#f2c46d;font-variant-numeric:tabular-nums}
  #tune input[type=range]{width:100%;margin:2px 0 0}
  #tune .btns{display:flex;gap:6px;margin-top:10px}
  #tune button{flex:1;background:#13283a;color:#e9dcb8;border:1px solid #2f5268;border-radius:5px;padding:6px;font:12px system-ui;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>

<div id="touch">
  <div class="tb" data-a="left"  style="left:16px;bottom:64px">◀</div>
  <div class="tb" data-a="right" style="left:146px;bottom:64px">▶</div>
  <div class="tb" data-a="up"    style="left:81px;bottom:126px">▲</div>
  <div class="tb" data-a="down"  style="left:81px;bottom:4px">▼</div>
  <div class="tb big" data-a="jump"  style="right:18px;bottom:28px">Jump</div>
  <div class="tb big" data-a="flash" style="right:108px;bottom:72px">Flash</div>
  <div class="tb" data-a="interact"  style="right:32px;bottom:124px">E</div>
  <div class="tb" data-a="heal"      style="right:196px;bottom:22px">Heal</div>
  <div class="tb" data-a="pause"     style="right:16px;top:12px;width:46px;height:46px">II</div>
</div>

<div id="tune" hidden>
  <h3>Feel tuning <small>T to close</small></h3>
  <div id="tuneBody"></div>
  <div class="btns"><button id="tReset">Reset</button><button id="tCopy">Copy JSON</button></div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   TUNING — every feel number lives here. Live-editable with T.
   ===================================================================== */
const TDEF = [
  {g:'Run'},
  {k:'runSpeed',     v:215,  min:80,  max:400,  s:5,    l:'Max run speed (px/s)'},
  {k:'groundAccel',  v:2600, min:400, max:6000, s:100,  l:'Ground accel'},
  {k:'groundDecel',  v:3200, min:400, max:8000, s:100,  l:'Ground decel (stop)'},
  {k:'airAccel',     v:1800, min:200, max:6000, s:100,  l:'Air accel'},
  {k:'airDecel',     v:1100, min:0,   max:6000, s:100,  l:'Air decel'},
  {k:'turnBoost',    v:1.6,  min:1,   max:3,    s:0.05, l:'Turn-around accel ×'},
  {g:'Jump'},
  {k:'jumpHeight',   v:3.6,  min:2,   max:6,    s:0.05, l:'Jump height (tiles)'},
  {k:'gravity',      v:2300, min:800, max:5000, s:50,   l:'Gravity'},
  {k:'fallMult',     v:1.55, min:1,   max:3,    s:0.05, l:'Fall gravity ×'},
  {k:'apexThreshold',v:70,   min:0,   max:250,  s:5,    l:'Apex hang window (|vy|)'},
  {k:'apexGravMult', v:0.55, min:0.2, max:1,    s:0.05, l:'Apex gravity ×'},
  {k:'maxFall',      v:640,  min:300, max:1200, s:10,   l:'Max fall speed'},
  {k:'jumpCut',      v:0.5,  min:0,   max:1,    s:0.05, l:'Jump release cut ×'},
  {k:'coyoteTime',   v:0.10, min:0,   max:0.3,  s:0.01, l:'Coyote time (s)'},
  {k:'jumpBuffer',   v:0.13, min:0,   max:0.3,  s:0.01, l:'Jump buffer (s)'},
  {k:'cornerNudge',  v:8,    min:0,   max:16,   s:1,    l:'Ceiling corner nudge (px)'},
  {g:'Flash (attack)'},
  {k:'attackCooldown',v:0.30,min:0.1, max:0.8,  s:0.01, l:'Cooldown (s)'},
  {k:'attackActive', v:0.10, min:0.03,max:0.3,  s:0.01, l:'Active window (s)'},
  {k:'attackBuffer', v:0.10, min:0,   max:0.3,  s:0.01, l:'Input buffer (s)'},
  {k:'attackReach',  v:50,   min:24,  max:100,  s:1,    l:'Reach (px)'},
  {k:'hitstop',      v:0.065,min:0,   max:0.2,  s:0.005,l:'Hit-stop on hit (s)'},
  {k:'killHitstop',  v:0.12, min:0,   max:0.3,  s:0.005,l:'Hit-stop on kill (s)'},
  {k:'enemyKnock',   v:340,  min:0,   max:800,  s:10,   l:'Enemy knockback'},
  {k:'recoil',       v:170,  min:0,   max:500,  s:10,   l:'Player recoil on hit'},
  {k:'pogoHeight',   v:2.4,  min:0.5, max:5,    s:0.05, l:'Down-flash pogo (tiles)'},
  {k:'flareRadius',  v:70,   min:0,   max:200,  s:5,    l:'Flash light burst (px)'},
  {g:'Getting hurt'},
  {k:'hurtInvuln',   v:1.1,  min:0.2, max:2.5,  s:0.05, l:'Invulnerability (s)'},
  {k:'hurtKnockX',   v:280,  min:0,   max:700,  s:10,   l:'Knockback X'},
  {k:'hurtKnockY',   v:360,  min:0,   max:800,  s:10,   l:'Knockback Y'},
  {k:'hurtLock',     v:0.22, min:0,   max:0.6,  s:0.01, l:'Control lock (s)'},
  {k:'hurtHitstop',  v:0.14, min:0,   max:0.4,  s:0.01, l:'Hit-stop when hurt (s)'},
  {g:'Camera & juice'},
  {k:'shakeHit',     v:3,    min:0,   max:15,   s:0.5,  l:'Shake: hit'},
  {k:'shakeKill',    v:6,    min:0,   max:20,   s:0.5,  l:'Shake: kill'},
  {k:'shakeHurt',    v:10,   min:0,   max:25,   s:0.5,  l:'Shake: hurt'},
  {k:'camLerp',      v:7,    min:1,   max:20,   s:0.5,  l:'Camera follow speed'},
  {k:'lookahead',    v:70,   min:0,   max:200,  s:5,    l:'Camera look-ahead (px)'},
  {k:'squash',       v:1,    min:0,   max:2,    s:0.1,  l:'Squash & stretch ×'},
  {g:'Light & healing'},
  {k:'lanternRadius',v:150,  min:80,  max:300,  s:5,    l:'Lantern radius (px)'},
  {k:'darkness',     v:0.88, min:0.5, max:1,    s:0.01, l:'Darkness opacity'},
  {k:'healTime',     v:0.9,  min:0.2, max:2,    s:0.05, l:'Heal channel time (s)'},
  {k:'oilPerHit',    v:0.34, min:0.05,max:1,    s:0.01, l:'Oil per hit (pips)'},
];
const T = {};
for (const d of TDEF) if (d.k) T[d.k] = d.v;
const TKEY = 'lumen.tuning.v1';
try { const s = JSON.parse(localStorage.getItem(TKEY) || '{}'); for (const k in s) if (k in T) T[k] = +s[k]; } catch (e) {}
const saveTune = () => { try { localStorage.setItem(TKEY, JSON.stringify(T)); } catch (e) {} };

/* =====================================================================
   Core constants & helpers
   ===================================================================== */
const TILE = 32, VW = 960, VH = 540, STEP = 1 / 120;
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
const FONT = 'Georgia, "Times New Roman", serif';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const rnd = (a, b) => a + Math.random() * (b - a);
const jumpVel = () => Math.sqrt(2 * T.gravity * T.jumpHeight * TILE);
const pogoVel = () => Math.sqrt(2 * T.gravity * T.pogoHeight * TILE);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* =====================================================================
   Input: keyboard, touch, gamepad → actions
   ===================================================================== */
const ACTIONS = {
  left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
  jump: ['Space', 'KeyZ', 'KeyK'], flash: ['KeyX', 'KeyJ'], interact: ['KeyE', 'KeyC'], heal: ['KeyF', 'KeyL'],
  pause: ['Escape', 'KeyP'], tune: ['KeyT'], start: ['Enter'],
};
const codeTo = {}; for (const a in ACTIONS) for (const c of ACTIONS[a]) codeTo[c] = a;
const kHeld = {}, vHeld = {}, pHeld = {}, pressed = {};
const isHeld = a => !!(kHeld[a] || vHeld[a] || pHeld[a]);
const take = a => { if (pressed[a]) { pressed[a] = false; return true; } return false; };
const clearPressed = () => { for (const a in pressed) pressed[a] = false; };

addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const a = codeTo[e.code]; if (!a) return;
  e.preventDefault();
  if (!e.repeat) pressed[a] = true;
  kHeld[a] = true;
});
addEventListener('keyup', e => { const a = codeTo[e.code]; if (a) kHeld[a] = false; });
addEventListener('blur', () => { for (const a in kHeld) kHeld[a] = false; for (const a in vHeld) vHeld[a] = false; });

const touchEl = document.getElementById('touch');
if ('ontouchstart' in window || matchMedia('(pointer:coarse)').matches) touchEl.classList.add('on');
addEventListener('touchstart', () => touchEl.classList.add('on'), { once: true, passive: true });
for (const b of touchEl.querySelectorAll('.tb')) {
  const a = b.dataset.a;
  const on = e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); vHeld[a] = true; pressed[a] = true; if (a === 'jump' || a === 'flash') pressed.start = true; b.classList.add('down'); };
  const off = e => { e.preventDefault(); vHeld[a] = false; b.classList.remove('down'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
}
canvas.addEventListener('pointerdown', () => { if (state === 'title' || state === 'end' || state === 'log') pressed.start = true; });

function pollPad() {
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null; for (const g of gps) if (g) { gp = g; break; }
  const now = {};
  if (gp) {
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0, b = i => gp.buttons[i] && gp.buttons[i].pressed;
    now.left = ax < -0.4 || b(14); now.right = ax > 0.4 || b(15);
    now.up = ay < -0.5 || b(12); now.down = ay > 0.5 || b(13);
    now.jump = b(0); now.flash = b(2); now.heal = b(1); now.interact = b(3);
    now.pause = b(9); now.start = b(9) || b(0);
  }
  for (const a in ACTIONS) { const v = !!now[a]; if (v && !pHeld[a]) pressed[a] = true; pHeld[a] = v; }
}

/* =====================================================================
   Level — Driftwood Hollow (prototype slice)
   ===================================================================== */
const W = 130, H = 24;
let grid;
function buildLevel() {
  grid = []; for (let y = 0; y < H; y++) grid.push(new Array(W).fill('.'));
  const R = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) grid[y][x] = c; };
  R(0, 0, W - 1, 1, '#'); R(0, 0, 0, H - 1, '#'); R(W - 1, 0, W - 1, H - 1, '#'); R(0, 20, W - 1, H - 1, '#');
  R(5, 2, 9, 4, '#'); R(30, 2, 38, 3, '#');
  // Shore steps
  R(14, 17, 16, 17, '#'); R(18, 15, 22, 19, '#');
  // First drowned gap — keeper's walkway hidden in the dark
  R(28, 20, 41, 20, '.'); R(28, 21, 41, H - 1, '~'); R(28, 20, 32, 20, '='); R(35, 20, 41, 20, '=');
  // The climb
  R(50, 17, 52, 17, '#'); R(45, 14, 47, 14, '#'); R(49, 11, 51, 11, '#'); R(54, 10, 56, 19, '#');
  R(60, 2, 70, 6, '#');
  // Second gap — stepping stones, one of them hidden
  R(72, 20, 85, 20, '.'); R(72, 21, 85, H - 1, '~'); R(74, 18, 75, 18, '#'); R(78, 17, 80, 17, '='); R(83, 18, 84, 18, '#');
  // Mirror hall
  R(90, 2, W - 1, 8, '#'); R(95, 18, 96, 18, '#'); R(98, 15, 99, 15, '#'); R(118, 9, 119, 19, 'D');
}
const tileAt = (x, y) => (x < 0 || x >= W || y < 0 || y >= H) ? '#' : grid[y][x];
const isSolid = (x, y) => { const c = tileAt(x, y); return c === '#' || c === 'D'; };
let hidden = []; // {x,y,a,lit}
const hiddenLit = (x, y) => { for (const h of hidden) if (h.x === x && h.y === y) return h.lit; return false; };
const isPlatform = (x, y) => tileAt(x, y) === '=' && hiddenLit(x, y);

const SPAWN = { x: 3 * TILE + 7, y: 20 * TILE - 28 };
const LORE = [
  { x: 10, title: "Keeper's Log I — The First Light",
    text: "The Pharos of Alexandria, finished around 280 BCE, was one of the Seven Wonders of the Ancient World. It is thought to have stood over 100 metres tall, with a fire burning at its top to guide ships into harbour.\nThe dark here is older than any fire. Keep yours lit." },
  { x: 26, title: "Keeper's Log II — Wickies",
    text: "Lighthouse keepers were nicknamed \"wickies\": they spent their nights trimming lamp wicks so the flame burned bright and clean, without blackening the glass with soot.\nThe old keepers' walkways answer only to light. Hold your lantern close to the drowned path." },
  { x: 43, title: "Keeper's Log III — Fresnel's Rings",
    text: "In 1822 Augustin-Jean Fresnel designed a lens built from rings of glass prisms. It gathered and bent light like a huge solid lens at a fraction of the weight, and the best could throw a beam more than 20 miles out to sea.\nThe Great Lighthouse's lenses were Fresnel's children." },
  { x: 68, title: "Keeper's Log IV — Every Light Has a Name",
    text: "Each lighthouse has its own \"characteristic\": a pattern of flashes, such as two quick flashes every ten seconds, so sailors can tell which light they are seeing. By day, painted stripes and colours called daymarks do the same job." },
  { x: 92, title: "Keeper's Log V — Angles",
    text: "The law of reflection: light leaves a mirror at the same angle it arrived. Set a mirror at 45 degrees and a beam turns a perfect corner.\nTurn the mirrors with [E], or strike them with your Flash. Lead the beam to the crystal." },
];
const MIRROR_DEF = [{ x: 100, y: 13, d: '/' }, { x: 100, y: 17, d: '/' }, { x: 108, y: 17, d: '\\' }];
const SRC = { x: 93, y: 13 }, CRY = { x: 108, y: 10 };
const BEACON_DEF = [6, 48, 88, 124];
const MURK_DEF = [25, 61, 66, 104, 113];

/* =====================================================================
   World state
   ===================================================================== */
let state = 'title', time = 0, freeze = 0, shake = 0, fade = 0, stateT = 0;
let P, enemies, beacons, mirrors, particles, toasts, crystal, door, checkpoint, beam, logOpen, stats;
const cam = { x: 0, y: 0, look: 0 };

function newPlayer() {
  return { x: SPAWN.x, y: SPAWN.y, w: 18, h: 28, vx: 0, vy: 0, facing: 1, grounded: false, coyote: 0, jumpBuf: 0, jumping: false,
    atkT: 0, atkCD: 0, atkBuf: 0, atkDir: 'side', atkHit: new Set(), atkVis: 0, atkFacing: 1,
    masks: 5, maxMasks: 5, oil: 0, inv: 0, hurtLock: 0, heal: 0, hazard: 0, flare: 0, sx: 1, sy: 1,
    dropT: 0, dust: 0, anim: 0, lastSafe: { x: SPAWN.x, y: SPAWN.y }, maskLost: 0 };
}
function resetEnemies() {
  enemies = MURK_DEF.map(x => ({ x: x * TILE + 4, y: 20 * TILE - 20, w: 24, h: 20, vx: 0, vy: 0, dir: -1, hp: 2,
    stun: 0, flash: 0, wind: 0, lungeCD: 0.5, beamT: 0, dead: false, t: Math.random() * 10, grounded: false }));
}
function newGame() {
  buildLevel();
  hidden = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y][x] === '=') hidden.push({ x, y, a: 0, lit: false });
  P = newPlayer();
  resetEnemies();
  beacons = BEACON_DEF.map((x, i) => ({ x, y: 19, lit: false, final: i === BEACON_DEF.length - 1, glow: 0, near: false }));
  mirrors = MIRROR_DEF.map(m => ({ ...m, ang: m.d === '/' ? -Math.PI / 4 : Math.PI / 4 }));
  particles = []; toasts = [];
  crystal = { charge: 0 }; door = { open: false, t: 0, opening: false };
  checkpoint = { x: SPAWN.x, y: SPAWN.y };
  stats = { time: 0, falls: 0, deaths: 0, kills: 0 };
  beam = { pts: [], hit: false };
  prerenderLevel();
  snapCam();
}

/* =====================================================================
   Physics
   ===================================================================== */
function solidRect(x, y, w, h) {
  const l = Math.floor(x / TILE), r = Math.floor((x + w - 0.01) / TILE), t = Math.floor(y / TILE), b = Math.floor((y + h - 0.01) / TILE);
  for (let ty = t; ty <= b; ty++) for (let tx = l; tx <= r; tx++) if (isSolid(tx, ty)) return true;
  return false;
}
function moveX(e, dx) {
  e.x += dx;
  const t = Math.floor(e.y / TILE), b = Math.floor((e.y + e.h - 0.01) / TILE);
  if (dx > 0) { const tx = Math.floor((e.x + e.w) / TILE); for (let ty = t; ty <= b; ty++) if (isSolid(tx, ty)) { e.x = tx * TILE - e.w; return true; } }
  else if (dx < 0) { const tx = Math.floor(e.x / TILE); for (let ty = t; ty <= b; ty++) if (isSolid(tx, ty)) { e.x = (tx + 1) * TILE; return true; } }
  return false;
}
function moveY(e, dy, oneWay, nudge) {
  const prevBottom = e.y + e.h;
  e.y += dy;
  const l = Math.floor(e.x / TILE), r = Math.floor((e.x + e.w - 0.01) / TILE);
  if (dy > 0) {
    const ty = Math.floor((e.y + e.h) / TILE);
    for (let tx = l; tx <= r; tx++)
      if (isSolid(tx, ty) || (oneWay && isPlatform(tx, ty) && prevBottom <= ty * TILE + 0.5)) { e.y = ty * TILE - e.h; return 'floor'; }
  } else if (dy < 0) {
    const ty = Math.floor(e.y / TILE);
    let hit = false; for (let tx = l; tx <= r; tx++) if (isSolid(tx, ty)) hit = true;
    if (hit) {
      // Corner correction: if we only clipped a ceiling corner, slide past it instead of bonking.
      for (let n = 1; nudge && n <= nudge; n++) for (const s of [-1, 1])
        if (!solidRect(e.x + s * n, e.y, e.w, e.h)) { e.x += s * n; return null; }
      e.y = (ty + 1) * TILE; return 'ceil';
    }
  }
  return null;
}

/* =====================================================================
   FX
   ===================================================================== */
function burst(x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const a = o.ang !== undefined ? o.ang + rnd(-o.spread, o.spread) : rnd(0, Math.PI * 2), s = rnd(o.smin || 30, o.smax || 160);
    const life = rnd(o.lmin || 0.25, o.lmax || 0.6);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, size: rnd(o.zmin || 1.5, o.zmax || 3.5),
      color: o.color, g: o.g || 0, add: !!o.add, drag: o.drag || 2 });
  }
}
const dust = (x, y, n, dir) => burst(x, y, n, { ang: dir === undefined ? -Math.PI / 2 : dir, spread: 1.1, smin: 20, smax: 90, color: '#9fb6c0', lmin: 0.2, lmax: 0.45, zmin: 1.5, zmax: 3, g: -40 });
function toast(text, dur = 2.6) { toasts.push({ text, t: dur, max: dur }); }
const addShake = s => { shake = Math.max(shake, s); };

/* =====================================================================
   Player
   ===================================================================== */
function attackBox(p) {
  const R = T.attackReach, cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  if (p.atkDir === 'up') return { x: cx - 26, y: p.y - R, w: 52, h: R + 8 };
  if (p.atkDir === 'down') return { x: cx - 26, y: p.y + p.h - 8, w: 52, h: R + 8 };
  return p.atkFacing > 0 ? { x: p.x + p.w - 6, y: cy - 22, w: R + 6, h: 44 } : { x: p.x - R, y: cy - 22, w: R + 6, h: 44 };
}
function hurtPlayer(fromX) {
  const p = P;
  if (p.inv > 0 || p.hazard > 0) return;
  p.masks--; p.maskLost = 0.6; p.heal = 0;
  p.inv = T.hurtInvuln; p.hurtLock = T.hurtLock;
  const dir = Math.sign(p.x + p.w / 2 - fromX) || -p.facing;
  p.vx = dir * T.hurtKnockX; p.vy = -T.hurtKnockY; p.jumping = false; p.grounded = false;

function drawPlayer() {

function drawMurkling(e) {
  const cx = e.x + e.w / 2, by = e.y + e.h;

  ctx.fillStyle = e.flash > 0 ? '#f4ecff' : '#0d0b1c';

  const n = 14, rx = 14, ry = 13 + (e.wind > 0 ? -2 : 0);

    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);

  for (let i = 0; i <= 5; i++) ctx.lineTo(cx + shiver + rx - i * (rx * 2 / 5), by + (i % 2 ? 2 : -1) + Math.sin(e.t * 9 + i) * 1.2);

function drawBeamCore() {
  if (beam.pts.length < 2) return;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(255,214,130,.5)'; ctx.lineWidth = 7; strokePts(ctx, beam.pts);

  L.push({ x: (SRC.x + 0.5) * TILE, y: (SRC.y + 0.5) * TILE, r: 70, i: 0.9 });
  L.push({ x: (CRY.x + 0.5) * TILE, y: (CRY.y + 0.5) * TILE, r: 40 + 110 * crystal.charge, i: 0.4 + 0.6 * crystal.charge });

function render() {

  const ox = -Math.round(cam.x) + sx, oy = -Math.round(cam.y) + sy;

  drawBackground();

  ctx.drawImage(levelCanvas, 0, 0);
  drawProps();
  for (const e of enemies) if (!e.dead) drawMurkling(e);
  if (state !== 'dying') drawPlayer();
  drawBeamCore();
  for (const q of particles) if (!q.add) { ctx.globalAlpha = clamp(q.life / q.max, 0, 1); ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size); }

  dctx.translate(ox, oy);

  }

    dctx.strokeStyle = 'rgba(0,0,0,.5)'; dctx.lineWidth = 44; strokePts(dctx, beam.pts);

  ctx.drawImage(dark, 0, 0);
  ctx.setTransform(rs, 0, 0, rs, 0, 0);

  // Additive glow pass
  ctx.save(); ctx.translate(ox, oy);
  ctx.globalCompositeOperation = 'lighter';
  if (state !== 'dying' && P._lx) glow(P._lx, P._ly, 60 + 30 * P.flare, `rgba(255,190,90,${0.22 + 0.25 * P.flare})`);
  for (const b of beacons) if (b.lit) glow((b.x + 0.5) * TILE, 20 * TILE - 40, 70, `rgba(255,170,70,${0.3 * b.glow})`);
  glow((CRY.x + 0.5) * TILE, (CRY.y + 0.5) * TILE, 50, `rgba(140,220,255,${0.1 + 0.4 * crystal.charge})`);
  if (beam.pts.length > 1) { ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,200,110,.14)'; ctx.lineWidth = 22; strokePts(ctx, beam.pts); }
  // Water surface shimmer so pits read in the dark
  ctx.strokeStyle = 'rgba(111,214,208,.35)'; ctx.lineWidth = 1.5;
  for (let x = 0; x < W; x++) if (tileAt(x, 21) === '~') {
    ctx.beginPath(); for (let i = 0; i <= 8; i++) { const wx = x * TILE + i * 4, wy = 21 * TILE + 4 + Math.sin(time * 2.4 + wx * 0.08) * 1.6; i ? ctx.lineTo(wx, wy) : ctx.moveTo(wx, wy); } ctx.stroke();

  if (f > 0) { ctx.fillStyle = `rgba(1,3,8,${f})`; ctx.fillRect(0, 0, VW, VH); }
  if (state === 'dying' && stateT > 0.5) { ctx.fillStyle = `rgba(233,220,184,${clamp((stateT - 0.5) * 2, 0, 1)})`; ctx.font = `italic 24px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('The light gutters… and returns to the last beacon.', VW / 2, VH / 2); }

  if (state === 'pause') drawPause();

}
function glow(x, y, r, col) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }

  ctx.textAlign = 'left';
  for (let i = 0; i < p.maxMasks; i++) drawMaskIcon(30 + i * 26, 30, i < p.masks, p.maskLost > 0 && i === p.masks);
  for (let i = 0; i < 3; i++) {
    const x = 22 + i * 22, y = 50, fill = clamp(p.oil - i, 0, 1);
    ctx.strokeStyle = '#8a6d44'; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, 14, 20);
    if (fill > 0) { ctx.fillStyle = fill >= 1 ? '#f2b347' : '#a7772e'; ctx.fillRect(x + 2, y + 2 + 16 * (1 - fill), 10, 16 * fill); }
  }
  if (p.oil >= 1 && p.masks < p.maxMasks) { ctx.fillStyle = 'rgba(233,220,184,.55)'; ctx.font = `12px ${FONT}`; ctx.fillText('hold F to heal', 92, 64); }
}
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(5,11,22,.92)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(242,196,109,.55)'; ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}
function wrapText(text, x, y, maxW, lh) {
  for (const para of text.split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = w; } else line = t;
    }
    ctx.fillText(line, x, y); y += lh * 1.35;
  }
  return y;
}
function drawLog() {
  const l = logOpen, w = 640, x = (VW - w) / 2, y = 300, h = 210;
  panel(x, y, w, h);
  ctx.textAlign = 'left'; ctx.fillStyle = '#f2c46d'; ctx.font = `bold 18px ${FONT}`; ctx.fillText(l.title, x + 24, y + 34);
  ctx.fillStyle = '#e3d8bd'; ctx.font = `15px ${FONT}`; wrapText(l.text, x + 24, y + 64, w - 48, 21);
  ctx.fillStyle = 'rgba(233,220,184,.5)'; ctx.font = `italic 12px ${FONT}`; ctx.textAlign = 'right'; ctx.fillText('E / Jump to close', x + w - 16, y + h - 12);
}
const CONTROLS = [
  ['Move', '← →  /  A D'], ['Aim up / down', '↑ ↓  /  W S'], ['Jump (hold = higher)', 'Space / Z / K'],
  ['Flash', 'X / J   (↑ up, ↓ down in air = pogo)'], ['Read / turn mirror', 'E / C'], ['Heal (hold)', 'F / L'],
  ['Pause', 'Esc / P'], ['Feel tuning panel', 'T'],
];
function drawControls(x, y) {
  ctx.font = `15px ${FONT}`;
  for (const [a, k] of CONTROLS) { ctx.textAlign = 'right'; ctx.fillStyle = '#9fb6c0'; ctx.fillText(a, x - 12, y); ctx.textAlign = 'left'; ctx.fillStyle = '#e9dcb8'; ctx.fillText(k, x + 12, y); y += 24; }
}
function drawTitle() {
  time += 1 / 60;
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#0c2238'); g.addColorStop(1, '#03080f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  const lx = VW / 2, ly = 150;
  const beamA = time * 0.6;
  ctx.globalCompositeOperation = 'lighter';
  for (const s of [1, -1]) {
    ctx.fillStyle = 'rgba(255,200,110,.06)'; ctx.beginPath(); ctx.moveTo(lx, ly);
    ctx.arc(lx, ly, 900, beamA * s + (s < 0 ? Math.PI : 0) - 0.08, beamA * s + (s < 0 ? Math.PI : 0) + 0.08); ctx.fill();
  }
  glow(lx, ly, 120, 'rgba(255,190,90,.25)');
  ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f2c46d'; ctx.font = `bold 84px ${FONT}`; ctx.fillText('LUMEN', VW / 2, 180);
  ctx.fillStyle = '#9fb6c0'; ctx.font = `italic 20px ${FONT}`; ctx.fillText('The Sunken Coast — prototype', VW / 2, 214);
  drawControls(VW / 2, 270);
  const a = 0.55 + 0.45 * Math.sin(time * 3);
  ctx.textAlign = 'center'; ctx.fillStyle = `rgba(242,196,109,${a})`; ctx.font = `18px ${FONT}`; ctx.fillText('Press Enter, Jump, or tap to begin', VW / 2, 488);
}
function drawPause() {
  ctx.fillStyle = 'rgba(1,3,8,.6)'; ctx.fillRect(0, 0, VW, VH);
  panel(VW / 2 - 260, 90, 520, 340);
  ctx.textAlign = 'center'; ctx.fillStyle = '#f2c46d'; ctx.font = `bold 28px ${FONT}`; ctx.fillText('Paused', VW / 2, 134);
  drawControls(VW / 2, 180);
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(233,220,184,.6)'; ctx.font = `italic 14px ${FONT}`; ctx.fillText('Esc / P to resume', VW / 2, 410);
}
function drawEnd() {
  const a = clamp(stateT / 1.2, 0, 1);
  ctx.fillStyle = `rgba(1,3,8,${0.85 * a})`; ctx.fillRect(0, 0, VW, VH);
  ctx.globalAlpha = a; ctx.textAlign = 'center';
  ctx.fillStyle = '#f2c46d'; ctx.font = `bold 40px ${FONT}`; ctx.fillText('The Focus Lens', VW / 2, 170);
  ctx.fillStyle = '#e3d8bd'; ctx.font = `17px ${FONT}`;
  wrapText('The first lens of the Great Lighthouse is yours. Far across the Sunken Coast, one window of the dark tower flickers gold.', VW / 2, 220, 560, 24);
  ctx.fillStyle = '#9fb6c0'; ctx.font = `italic 16px ${FONT}`; ctx.fillText('— End of the Lumen prototype —', VW / 2, 320);
  const t = Math.floor(stats.time), mm = String(Math.floor(t / 60)).padStart(2, '0'), ss = String(t % 60).padStart(2, '0');
  ctx.fillStyle = '#e9dcb8'; ctx.font = `15px ${FONT}`;
  ctx.fillText(`Time ${mm}:${ss}   ·   Falls ${stats.falls}   ·   Lights out ${stats.deaths}   ·   Murklings banished ${stats.kills}`, VW / 2, 360);
  if (stateT > 1) { ctx.fillStyle = `rgba(242,196,109,${0.55 + 0.45 * Math.sin(time * 3)})`; ctx.fillText('Press Enter, Jump, or tap to return to the title', VW / 2, 430); }
  ctx.globalAlpha = 1;
}

/* =====================================================================
   Tuning panel
   ===================================================================== */
const tuneEl = document.getElementById('tune'), tuneBody = document.getElementById('tuneBody');
const inputs = {};
function buildTune() {
  tuneBody.innerHTML = '';
  for (const d of TDEF) {
    if (d.g) { const h = document.createElement('div'); h.className = 'g'; h.textContent = d.g; tuneBody.appendChild(h); continue; }
    const lab = document.createElement('label');
    const row = document.createElement('div'); row.className = 'row';
    const nm = document.createElement('span'); nm.textContent = d.l;
    const val = document.createElement('span'); val.className = 'v';
    row.append(nm, val);
    const inp = document.createElement('input'); inp.type = 'range'; inp.min = d.min; inp.max = d.max; inp.step = d.s; inp.value = T[d.k];
    const show = () => { val.textContent = (+T[d.k]).toFixed(d.s < 0.01 ? 3 : d.s < 1 ? 2 : 0); };
    inp.addEventListener('input', () => { T[d.k] = +inp.value; show(); saveTune(); });
    show(); inputs[d.k] = { inp, show };
    lab.append(row, inp); tuneBody.appendChild(lab);
  }
}
function toggleTune() { tuneEl.hidden = !tuneEl.hidden; }
document.getElementById('tReset').onclick = () => { for (const d of TDEF) if (d.k) { T[d.k] = d.v; inputs[d.k].inp.value = d.v; inputs[d.k].show(); } saveTune(); };
document.getElementById('tCopy').onclick = () => {
  const s = JSON.stringify(T, null, 2);
  (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => { if (P) toast('Tuning copied to clipboard.'); }).catch(() => prompt('Copy tuning JSON:', s));
};
buildTune();

/* =====================================================================
   Sizing & main loop
   ===================================================================== */
let renderScale = 1;
function resize() {
  const s = Math.min(innerWidth / VW, innerHeight / VH), dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderScale = Math.max(0.5, s * dpr);
  canvas.width = Math.round(VW * renderScale); canvas.height = Math.round(VH * renderScale);
  canvas.style.width = Math.round(VW * s) + 'px'; canvas.style.height = Math.round(VH * s) + 'px';
  dark.width = canvas.width; dark.height = canvas.height;
}
addEventListener('resize', resize); resize();
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  pollPad();
  acc += dt;
  while (acc >= STEP) { tick(STEP); acc -= STEP; }
  if (state !== 'title') updateCam(dt);
  shake = Math.max(0, shake - dt * 45);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Small hook for automated testing / debugging in the console.
window.__lumen = { T, get P() { return P; }, get state() { return state; }, get enemies() { return enemies; }, get beam() { return beam; }, get door() { return door; }, mirrors: () => mirrors, tick, newGame };
})();
</script>
